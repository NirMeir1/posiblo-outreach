<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>התחברות לאזור האישי</title></head>
<body>
<h1>יש להתחבר כדי לפנות אלינו</h1>
<form action="/login" method="post">
  <label>שם משתמש <input type="text" name="username" required></label>
  <label>אימייל <input type="email" name="email"></label>
  <label>סיסמה <input type="password" name="password" required></label>
  <button type="submit">כניסה</button>
</form>
</body>
</html>
