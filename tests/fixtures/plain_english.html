<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact us</title></head>
<body>
<nav><form action="/search" method="get"><input type="text" name="q" placeholder="Search"><button>Go</button></form></nav>
<h1>Get in touch</h1>
<form id="contact-form" action="/contact/send" method="POST">
  <label for="fullname">Your name *</label>
  <input id="fullname" type="text" name="fullname" required>
  <label for="em">Email address *</label>
  <input id="em" type="email" name="email" required>
  <label for="ph">Phone</label>
  <input id="ph" type="tel" name="phone">
  <label for="subj">Subject</label>
  <input id="subj" type="text" name="subject">
  <label for="msg">Message *</label>
  <textarea id="msg" name="message" required></textarea>
  <label for="ref">How did you hear about us?</label>
  <select id="ref" name="referral"><option>Google</option><option>Friend</option></select>
  <input type="hidden" name="csrf_token" value="abc123">
  <button type="submit" name="send" value="1">Send message</button>
</form>
</body>
</html>
