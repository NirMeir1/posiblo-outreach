[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posiblo-outreach"
version = "0.1.0"
description = "Send one fixed consent-request message per business website contact form, exactly once."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: tldextract's bundled public-suffix list decides site keys, so no version may change
# silently. requirements.lock pins the transitive packages too; keep both files in step.
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "tldextract==5.4.0",
    "flask==3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-httpserver==1.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outreach = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
