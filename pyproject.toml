[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posiblo-outreach"
version = "0.1.0"
description = "Send one fixed consent-request message per business website contact form, exactly once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
    "tldextract",
    "flask",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpserver",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outreach = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
